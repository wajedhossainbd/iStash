# Every push to main builds iStash and publishes it as the latest release: a DMG to download, the signed
# update package the app installs by itself, and the install script. Pull requests only build and test.
name: Release

on:
  push:
    branches: [main]
    # Changes to docs alone don't need a new version of the app.
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install and test the UI
        working-directory: app/ui
        run: |
          npm ci
          npm run build
          npm test

      - name: Test the shell
        working-directory: app/src-tauri
        run: cargo test

      # The version counts up with every release, so installed copies see each one as newer.
      - name: Set the version
        if: github.event_name == 'push'
        run: |
          VERSION="0.1.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          node -e "const f='app/src-tauri/tauri.conf.json',c=require('./'+f);c.version=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(c,null,2)+'\n')" "$VERSION"

      # Every release is signed with the same self-made certificate, so macOS sees each update as the same app and keeps
      # its permissions (camera, drives, Finder). codesign only uses a trusted certificate, so it is trusted for code
      # signing on this throwaway runner; users' Macs don't need to trust it.
      # Tauri's own certificate import only accepts Apple-issued names, so the keychain is set up here and Tauri is
      # given just the identity name, which it passes to codesign.
      - name: Set up the signing certificate
        if: github.event_name == 'push'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/istash.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/istash.p12"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          security import "$RUNNER_TEMP/istash.p12" -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/istash.p12"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain app/src-tauri/signing/istash.crt
          security find-identity -v -p codesigning "$KC" | grep -q '"iStash Self Signed"'

      - name: Build the app, DMG and update package
        if: github.event_name == 'push'
        working-directory: app/ui
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_SIGNING_IDENTITY: iStash Self Signed
        run: npm run app:build

      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          B=app/src-tauri/target/release/bundle
          mkdir out
          cp "$B"/dmg/*.dmg out/iStash.dmg
          cp "$B/macos/iStash.app.tar.gz" out/
          cp install.sh out/
          node app/latest-json.mjs "$VERSION" "$B/macos/iStash.app.tar.gz.sig" "$GITHUB_REPOSITORY" > out/latest.json
          # Notes come from CHANGELOG.md: the section for this version, or "Unreleased" if it has no section yet.
          SECTION=$(grep -q "^## $VERSION " CHANGELOG.md && echo "$VERSION" || echo Unreleased)
          awk -v v="$SECTION" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > notes.md
          if grep -q '[^[:space:]]' notes.md && ! grep -qx 'Nothing yet.' notes.md; then
            gh release create "v$VERSION" out/* --latest --title "iStash $VERSION" --notes-file notes.md
          else
            gh release create "v$VERSION" out/* --latest --title "iStash $VERSION" --generate-notes
          fi
